# ==============================================================================
# nginx.conf - InfoLine Frontend
# ==============================================================================
# Configuration Nginx pour servir l'application Angular buildée.
#
# Flux réseau :
# LoadBalancer AWS → Service K8s (port 80) → Pod Nginx (port 80)
#                   → fichiers statiques Angular (/usr/share/nginx/html)
# ==============================================================================

server {
    listen 80;           # Port d'écoute Nginx
    server_name localhost;

    # Répertoire racine des fichiers Angular buildés.
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # Routing Angular (SPA - Single Page Application)
    # --------------------------------------------------------------------------
    # try_files : tente de servir le fichier ou répertoire demandé.
    # Si $uri et $uri/ n'existent pas sur le disque, retourne index.html.
    #
    # Sans cette règle un refresh sur /products ou /admin retournerait un 404 car
    # ces chemins n'existent pas comme fichiers physiques.
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Cache des assets statiques
    # --------------------------------------------------------------------------
    # expires 1y : durée de cache navigateur de 1 an pour les assets statiques.
    # Cache-Control "public, immutable" : indique aux proxies et navigateurs que
    # le fichier ne changera jamais.
    # --------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}