apiVersion: apps/v1
kind: Deployment
metadata:
  name: infoline-frontend
  namespace: infoline-frontend
  labels:
    app: infoline-frontend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infoline-frontend
  template:
    metadata:
      labels:
        app: infoline-frontend
        version: v1
    spec:
      containers:
      - name: frontend
        image: 744804011706.dkr.ecr.eu-west-3.amazonaws.com/infoline-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3